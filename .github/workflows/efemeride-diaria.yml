name: Efeméride diaria

on:
  schedule:
    # 03:17 UTC (no en hora rodona): las ejecuciones a las 00:00, 06:00, etc.
    # tienen mucha cola en GitHub y a menudo se descartan del todo, no solo
    # se retrasan. Un minuto "no redondo" dentro de una franja de poco
    # tráfico reduce el riesgo de que el evento se pierda (como pasó el 27/08).
    - cron: "17 3 * * *"
  workflow_dispatch: {}


permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generar efeméride del día
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generar-efemeride.mjs

      - name: Confirmar y subir cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/efemerides.json efemerides/ sitemap.xml
          if git diff --cached --quiet; then
            echo "Sin cambios que subir (hoy no había ningún hecho verificado)."
            exit 0
          fi
          git commit -m "Efeméride del día $(date -u +%F)"
          git pull --rebase
          git push
