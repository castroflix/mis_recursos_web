name: Efeméride diaria

on:
  schedule:
    # 06:30 UTC todos los días
    - cron: "30 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generar efeméride del día
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generar-efemeride.mjs

      - name: Confirmar y subir cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/efemerides.json efemerides/
          if git diff --cached --quiet; then
            echo "Sin cambios que subir (hoy no había ningún hecho verificado)."
            exit 0
          fi
          git commit -m "Efeméride del día $(date -u +%F)"
          git pull --rebase
          git push
